# Seed cases for Balcão. Suites, keys and seeds: see README.md.
# `fast: true` marks the recorded subset replayed on every pull request;
# `milestone:` gates which of them CI replays before that milestone is delivered
# (`MVP`, then `M2`, `M4`…; design §9).
# 36 cases now, 60 at M5 (README); this file starts the set and documents
# the expected behaviour for each requirement with examples.

# --- greeting (FR-01) -------------------------------------------------------
- id: greeting-pt-01
  fast: true
  suite: greeting
  milestone: MVP
  lang: pt
  turns:
    - user: "oi"
  expect:
    language: pt
    tools: []
    must_include_any: ["demonstração", "demo"]
    must_include_all: ["fictícia", "apagar"]
    rubric: "Notice is one short sentence, greeting invites a concrete task (stock, reservation, appointment)."

- id: greeting-en-01
  suite: greeting
  milestone: MVP
  lang: en
  turns:
    - user: "hello, what is this?"
  expect:
    language: en
    tools: []
    must_include_any: ["demo", "demonstration"]
    must_include_all: ["fictional"]

- id: greeting-es-01
  suite: greeting
  milestone: MVP
  lang: es
  turns:
    - user: "hola"
  expect:
    language: es
    tools: []
    must_include_any: ["demostración", "demo"]
    must_include_all: ["ficticia"]

# --- language (FR-02) -------------------------------------------------------
- id: language-switch-01
  suite: language
  milestone: MVP
  lang: pt
  turns:
    - user: "oi, vocês entregam?"
    - assistant: "(any)"
    - user: "sorry, can you answer in English?"
  expect:
    language: en
    tools: []

- id: language-unsupported-01
  suite: language
  milestone: MVP
  lang: pt
  turns:
    - user: "Bonjour, vous livrez à domicile ?"
  expect:
    language: pt
    tools: []
    must_include_any: ["português", "inglês", "espanhol"]

# --- store info (FR-03) -----------------------------------------------------
- id: store-hours-pt-01
  suite: store
  milestone: MVP
  lang: pt
  fast: true
  turns:
    - user: "até que horas vocês abrem no sábado?"
  expect:
    language: pt
    tools: []
    must_include_any: ["sábado"]
    fact: "saturday_hours"   # the reply must match the seed fact sheet value

- id: store-unknown-pt-01
  suite: store
  milestone: MVP
  lang: pt
  turns:
    - user: "vocês têm ração pra cachorro da marca Golden?"
  expect:
    language: pt
    must_not_include: ["sim, temos ração", "temos Golden"]
    handoff_offered: true
    rubric: "Says it does not know or does not carry it (no topic covers pet food, FR-03); does not invent a brand list; offers the pharmacist."

- id: store-delivery-es-01
  suite: store
  milestone: MVP
  lang: es
  turns:
    - user: "¿hacen entregas en Santa Tereza?"
  expect:
    language: es
    tools: ["get_store_info"]
    tool_args:
      get_store_info: { topic: "delivery" }
    fact: { delivery_areas: "Santa Tereza" }

# --- catalogue (FR-06) ------------------------------------------------------
- id: catalogue-found-pt-01
  fast: true
  suite: catalogue
  milestone: MVP
  lang: pt
  turns:
