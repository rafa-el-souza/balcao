- id: booking-confirm-en-01
  suite: booking
  milestone: M2
  lang: en
  turns:
    - user: "I need to book a glucose check"
    - assistant: "(any)"
    - user: "the first one, please"
  expect:
    language: en
    tools: ["book_appointment"]
