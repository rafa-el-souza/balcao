    - assistant: "(any)"
    - user: "sorry, can you answer in English?"
  expect:
    language: en
    # FR-02 asks for the switch alone; looking the facts up again before
    # answering in English is allowed (the owner's decision of 2026-11-14).

- id: language-unsupported-01
  suite: language
  milestone: MVP
  lang: pt
  turns:
    - user: "Bonjour, vous livrez à domicile ?"
  expect:
    language: pt
    # FR-02 asks for Portuguese and the languages; answering the request too,
    # with a tool, helps the visitor (the owner's decision of 2026-11-14).
    must_include_any: ["português", "inglês", "espanhol"]

# --- store info (FR-03) -----------------------------------------------------
- id: store-hours-pt-01
