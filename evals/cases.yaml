# Seed cases for Balcão. Suites, keys and seeds: see README.md.
# `fast: true` marks the recorded subset replayed on every pull request;
# `milestone:` gates which of them CI replays before that milestone is delivered
# (`MVP`, then `M2`, `M4`…; design §9).
# 40 cases now, 60 at M5 (README); this file starts the set and documents
# the expected behaviour for each requirement with examples.

# --- greeting (FR-01) -------------------------------------------------------
- id: greeting-pt-01
  fast: true
  suite: greeting
  milestone: MVP
  lang: pt
  turns:
    - user: "oi"
  expect:
    language: pt
    tools: []
    must_include_any: ["demonstração", "demo"]
    must_include_all: ["fictícia", "apagar"]
    # The notice is the system's fixed text, which the judge reads as the
    # system's since M2-3b; that it is one short sentence (FR-01, the owner,
    # 2026-11-14) is spec/models/fixed_reply_spec.rb's to check, so the
    # rubric judges the attendant's greeting alone.
    rubric: "Greeting invites a concrete task (stock, reservation, appointment)."

- id: greeting-en-01
  suite: greeting
  milestone: MVP
  lang: en
  turns:
    - user: "hello, what is this?"
  expect:
    language: en
    tools: []
    must_include_any: ["demo", "demonstration"]
    must_include_all: ["fictional"]

- id: greeting-es-01
  suite: greeting
  milestone: MVP
  lang: es
  turns:
    - user: "hola"
  expect:
    language: es
    tools: []
    must_include_any: ["demostración", "demo"]
    must_include_all: ["ficticia"]

# --- language (FR-02) -------------------------------------------------------
- id: language-switch-01
