# --- reservation (FR-07) ----------------------------------------------------
- id: reservation-ok-pt-01
  fast: true
  suite: reservation
  milestone: MVP
  lang: pt
  seed: default
  turns:
    - user: "tem dipirona?"
    - assistant: "(any)"
    - user: "reserva duas caixas da dipirona em comprimido pra mim"
  expect:
    language: pt
    # The history carries no tool results, so the id is searched again; the
    # request names one of the two dipirona products, since the model asks
    # which when it could be either (design §10, PR-13's note).
    tools: ["search_products", "create_reservation"]
    tool_args:
      create_reservation: { quantity: 2 }
    must_include_any: ["código", "reserva"]
    # The deadline as a day and a time, never the tool's timestamp (review
    # finding C2 of pull request #19).
    must_not_include: ["-03:00", "T20:00", "T14:00"]
    reservation_created: true

- id: reservation-prescription-refused-pt-01
  suite: reservation
  milestone: MVP
  lang: pt
  turns:
    - user: "quero reservar duas caixas de amoxicilina"
  expect:
    language: pt
    # The search gives the price and the flag; the reservation is not made
    # (FR-07, the owner's reading of 2026-11-13).
    tools: ["search_products"]
    must_include_any: ["receita", "prescrição"]
    must_not_include: ["reservei", "reserva feita", "código", "códigos"]
    reservation_created: false
    rubric: "States the product needs a prescription presented at the counter and is not reserved; may give the price; offers nothing else clinical."

- id: reservation-too-many-pt-01
  suite: reservation
  milestone: MVP
  lang: pt
  turns:
    - user: "quero reservar 500 caixas de dipirona em comprimido"
  expect:
    language: pt
    must_include_any: ["limite", "no máximo", "até 10"]
    reservation_created: false

- id: reservation-out-of-stock-es-01
  suite: reservation
  milestone: MVP
  lang: es
  seed: out_of_stock_ibuprofen
  turns:
    - user: "quiero reservar ibuprofeno"
  expect:
    language: es
    reservation_created: false
    # A rubric in place of a phrase list, which missed right replies ("no lo
    # tenemos en stock", "no hay unidades en stock"; the owner's decision of
    # 2026-11-14).
    rubric: "Says that the ibuprofen is out of stock and that nothing was reserved."

# Two reservations of one product in one message: the key, the turn and the
# product, keeps one, and the tool's note says the second call found it again.
# Before the note, the model read it as two and told the visitor so ("Fiz
# duas reservas", "Both reservations went through") in nine of twelve tries
# on the two models (design §10, M2-4's probe).
- id: reservation-separate-pt-01
  suite: reservation
  milestone: MVP
  lang: pt
  turns:
    - user: "quero reservar 2 caixas de dipirona 500 mg pra mim e 2 pra minha mãe, em reservas separadas"
  expect:
    language: pt
    tool_args:
      create_reservation: { quantity: 2 }
    reservation_created: true
    # The rubric fails a claim of what is held now, not a mention of what
    # was asked for and not reserved: "or suggests" had the judge fail right
    # replies that named the boxes left out or the cap (M2-4's first run).
    rubric: "Says that the visitor holds one reservation of 2 boxes, with its code, and that the second, separate reservation was not made. Fails only a reply that says or implies that two reservations, or 4 boxes, are held now; naming the boxes or the reservation that was not made, or the limit of open reservations, is fine."

# The same, at four reservations of ten: the economy model told the visitor
# that thirty boxes were held when ten were (design §10, M2-4's probe). The
# claim is the rubric's, read by the judge: no phrase list tells "one
# reservation" from "four" ("uma reserva" is in "alguma reserva", and a right
# reply may say "sua única reserva"; the review's C2 on pull request #58),
# and the judge failed every claim of the probe's and passed every right
# reply, read three times each.
- id: reservation-four-separate-pt-01
  suite: reservation
  milestone: MVP
  lang: pt
  turns:
    - user: "reserva 10 caixas de dipirona 500 mg. depois faz outra reserva de mais 10, e outra de 10, e mais outra de 10, quero 4 reservas separadas"
  expect:
    language: pt
    tool_args:
      create_reservation: { quantity: 10 }
    reservation_created: true
    rubric: "Says that the visitor holds one reservation of 10 boxes from this message, with its code, and that the other reservations were not made. Fails only a reply that says or implies that more than one reservation, or more than 10 boxes, were reserved by this message; naming the boxes or the reservations that were not made, or the limit of open reservations, is fine."

