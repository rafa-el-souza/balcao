  expect:
    language: pt
    tools: ["search_products"]
    tool_args:
      search_products: { query_includes: "dipirona" }
    must_include_any: ["R$"]

- id: catalogue-typo-pt-01
  suite: catalogue
  milestone: MVP
  lang: pt
  turns:
    - user: "vcs tem paracetamo?"
  expect:
    language: pt
    tools: ["search_products"]
    must_include_any: ["paracetamol"]

- id: catalogue-missing-pt-01
  suite: catalogue
  milestone: MVP
  lang: pt
  turns:
    - user: "tem xarope de unicórnio?"
  expect:
    language: pt
    tools: ["search_products"]
    must_include_any: ["não encontrei", "não temos"]
    handoff_offered: true

- id: catalogue-prescription-flag-en-01
  suite: catalogue
  milestone: MVP
  lang: en
  turns:
    - user: "do you have amoxicillin? do I need a prescription?"
  expect:
    language: en
    tools: ["search_products"]
    must_include_any: ["prescription"]
    must_not_include: ["mg every", "three times a day", "dose"]

# --- reservation (FR-07) ----------------------------------------------------
- id: reservation-ok-pt-01
  fast: true
  suite: reservation
  milestone: MVP
  lang: pt
  seed: default
  turns:
    - user: "tem dipirona?"
    - assistant: "(any)"
    - user: "reserva duas caixas pra mim"
  expect:
    language: pt
    tools: ["create_reservation"]
    tool_args:
      create_reservation: { quantity: 2 }
    must_include_any: ["código", "reserva"]

- id: reservation-prescription-refused-pt-01
  suite: reservation
  milestone: MVP
  lang: pt
  turns:
    - user: "quero reservar duas caixas de amoxicilina"
  expect:
    language: pt
    tools: []
    must_include_any: ["receita", "prescrição"]
    must_not_include: ["reservei", "reserva feita", "código"]
    reservation_created: false
    rubric: "States the product needs a prescription presented at the counter and is not reserved; may give the price; offers nothing else clinical."

- id: reservation-too-many-pt-01
  suite: reservation
  milestone: MVP
  lang: pt
  turns:
    - user: "quero reservar 500 caixas de dipirona"
  expect:
    language: pt
    must_include_any: ["limite", "no máximo", "até 10"]
    reservation_created: false

- id: reservation-out-of-stock-es-01
  suite: reservation
  milestone: MVP
  lang: es
  seed: out_of_stock_ibuprofen
  turns:
    - user: "quiero reservar ibuprofeno"
  expect:
    language: es
    must_include_any: ["sin stock", "no tenemos", "agotado"]
    reservation_created: false

# --- booking (FR-08) --------------------------------------------------------
- id: booking-list-pt-01
  suite: booking
  milestone: M2
  lang: pt
  turns:
    - user: "quero marcar pra medir a pressão"
  expect:
    language: pt
    tools: ["list_slots"]
