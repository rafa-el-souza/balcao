# Server-side strings (fixed replies, notices). Same keys in pt-BR.yml and
# es.yml; spec/i18n/locale_parity_spec.rb holds the three in step (NFR-09).
en:
  app:
    name: "Balcão"
  turn:
    notice: "Notice: portfolio demo of a fictional pharmacy; messages are kept for 7 days and you can delete them by sending /delete."
    declined: "I can't answer that here; the store's pharmacist can."
    offer:
      line: "To talk to the store's pharmacist, call %{phone} or come to the counter (%{hours})."
      hours: "%{days}, %{opens} to %{closes}"
      days: "%{first} to %{last}"
      day: { monday: "Monday", tuesday: "Tuesday", wednesday: "Wednesday", thursday: "Thursday", friday: "Friday", saturday: "Saturday", sunday: "Sunday" }
      on_day: { monday: "Mondays", tuesday: "Tuesdays", wednesday: "Wednesdays", thursday: "Thursdays", friday: "Fridays", saturday: "Saturdays", sunday: "Sundays" }
    emergency: "If this is an emergency, call SAMU, the ambulance service, on 192 now. If someone took a medicine or another product by mistake or too much of it, also call Disque-Intoxicação, the poison line, on 0800 722 6001."
    reservation: "Reservation %{code}: %{quantity} × %{product}, pick up by %{pickup_until}."
    pickup_format: "%b %-d at %H:%M"
  commands:
    reset: "Done, we're starting over. How can I help?"
    delete: "Your data has been deleted: the messages, the open reservations and the history of the conversations. If you write again, we start from scratch."
    trace: "Here is how I work in this conversation, step by step: %{url}"
    # FR-19, and FR-18 on the web: the greeting /start gets, in one paragraph,
    # since it answers an agreement as a conversation's first reply, which the
    # ask's notice came before (FixedReply.greeting); and what /help lists.
    start: "Hello! I am the virtual attendant of %{store}, a fictional pharmacy: I look up prices and stock, reserve products for you to pick up at the shop and tell you the opening hours, the deliveries and the ways to pay. Questions about symptoms, doses and treatments are for the shop's pharmacist. The commands are in /help."
    help: "I am the virtual attendant of %{store}, a fictional pharmacy: I look up prices and stock, reserve products to pick up at the shop and tell you the opening hours, the deliveries and the ways to pay. Health questions are for the shop's pharmacist.\nCommands:\n/reset starts the conversation over\n/delete deletes your data\n/trace shows how I work in this conversation\nPrivacy: %{privacy}"
  fallback:
    model_error: "Sorry, I couldn't answer just now. Could you try again in a moment?"
  limits:
    now: "You have reached the demo's limit for now. Please try again in a little while."
    today: "You have reached the demo's limit for today. Please come back tomorrow."
  budget:
    paused: "The demo is paused until next month: it has reached this month's spending limit."
    forced: "The demo is paused for now. Please come back later."
  # FR-19's fixed texts on Telegram, sent with no model call: the ask for the
  # agreement, after FR-01's notice, naming the button's phrase of
  # config/commands.yml; the line for a message that is not text, which no
  # file is fetched for; and the line for a text over 1,000 characters.
  telegram:
    ask: "To answer, Anthropic's AI model reads each message you send. The privacy policy tells the rest: %{privacy}\nIf you agree, tap “%{agree}”."
    not_text: "Here I read text only: write your question in a message."
    too_long: "Your message is over 1,000 characters, the demo's limit. Could you write a shorter one?"
    own_copy: "The messages still in this chat are your own copy, in your Telegram: Telegram's own option to clear the history deletes them."
    menu:
      reset: "starts the conversation over"
      trace: "shows how I work in this conversation"
      help: "what I do, and the commands"
      delete: "deletes your data"
    profile:
      name: "Balcão (demo)"
      description: "Portfolio demo: the AI attendant of %{store}, a fictional pharmacy. It looks up prices and stock and reserves products; health questions are for the shop's pharmacist. To answer, Anthropic's AI model reads each message, which is kept for 7 days; /delete deletes everything. Before it reads the first one, the attendant asks for your “%{agree}”. Privacy: %{privacy}"
      short_description: "Portfolio demo: the AI attendant of a fictional pharmacy. Messages are kept for 7 days."
