# Server-side strings (fixed replies, notices). Same keys in pt-BR.yml and
# es.yml; spec/i18n/locale_parity_spec.rb holds the three in step (NFR-09).
en:
  app:
    name: "Balcão"
  turn:
    notice: "Notice: portfolio demo of a fictional pharmacy; messages are kept for 7 days and you can delete them by sending /delete."
    declined: "I can't answer that here; the store's pharmacist can."
    offer:
      line: "To talk to the store's pharmacist, call %{phone} or come to the counter (%{hours})."
      hours: "%{days}, %{opens} to %{closes}"
      days: "%{first} to %{last}"
      day: { monday: "Monday", tuesday: "Tuesday", wednesday: "Wednesday", thursday: "Thursday", friday: "Friday", saturday: "Saturday", sunday: "Sunday" }
      on_day: { monday: "Mondays", tuesday: "Tuesdays", wednesday: "Wednesdays", thursday: "Thursdays", friday: "Fridays", saturday: "Saturdays", sunday: "Sundays" }
    emergency: "If this is an emergency, call SAMU, the ambulance service, on 192 now. If someone took a medicine or another product by mistake or too much of it, also call Disque-Intoxicação, the poison line, on 0800 722 6001."
    reservation: "Reservation %{code}: %{quantity} × %{product}, pick up by %{pickup_until}."
    pickup_format: "%b %-d at %H:%M"
  commands:
    reset: "Done, we're starting over. How can I help?"
    delete: "Your data has been deleted: the messages, the open reservations and the history of the conversations. If you write again, we start from scratch."
    trace: "Here is how I work in this conversation, step by step: %{url}"
  fallback:
    model_error: "Sorry, I couldn't answer just now. Could you try again in a moment?"
  limits:
    now: "You have reached the demo's limit for now. Please try again in a little while."
    today: "You have reached the demo's limit for today. Please come back tomorrow."
