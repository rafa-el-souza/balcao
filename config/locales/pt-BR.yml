# Server-side strings (fixed replies, notices). Same keys in en.yml and
# es.yml; spec/i18n/locale_parity_spec.rb holds the three in step (NFR-09).
pt-BR:
  app:
    name: "Balcão"
  turn:
    # Before the first reply of a conversation (FR-01), one sentence (the
    # owner's decision of 2026-11-14). It names the delete command of its
    # language (config/commands.yml).
    notice: "Aviso: demonstração de portfólio com uma farmácia fictícia; as mensagens ficam guardadas por 7 dias e você pode apagá-las enviando /apagar."
    # FR-09's decline: the reply to a refusal (threat model SR-19) and, from
    # M2, to a reply the guardrail replaces (FR-20). After a refusal the turn
    # puts the emergency line after it (the owner, 2026-11-15). The
    # pharmacist is the store's, never "de plantão" (the owner's decision of
    # 2026-11-14).
    declined: "Isso eu não posso responder por aqui; quem responde é o farmacêutico da loja."
    # FR-10's MVP note: the offer of the pharmacist, with the phone and the
    # counter's hours of config/store.yml (FixedReply.offer). Days in a row
    # with the same hours go together: "days" for a run, "on_day" for a day.
    offer:
      line: "Para falar com o farmacêutico da loja, ligue %{phone} ou venha ao balcão (%{hours})."
      hours: "%{days}, das %{opens} às %{closes}"
      days: "de %{first} a %{last}"
      day: { monday: "segunda", tuesday: "terça", wednesday: "quarta", thursday: "quinta", friday: "sexta", saturday: "sábado", sunday: "domingo" }
      on_day: { monday: "às segundas", tuesday: "às terças", wednesday: "às quartas", thursday: "às quintas", friday: "às sextas", saturday: "aos sábados", sunday: "aos domingos" }
    # FR-09: a message that may be an emergency (the owner's decision of
    # 2026-11-14). Real public numbers on purpose, checked that day: SAMU's
    # 192 and Anvisa's free Disque-Intoxicação; and CVV's 188, free and
    # answered 24 hours a day, for someone thinking of hurting themselves
    # (the owner, 2026-11-15; read at cvv.org.br that day).
    emergency: "Se for uma urgência, ligue agora para o SAMU, no 192. Se alguém tomou remédio ou outro produto por engano ou em excesso, ligue também para o Disque-Intoxicação, no 0800 722 6001. Se você está pensando em se machucar ou em tirar a própria vida, ligue para o CVV, no 188: a ligação é gratuita e eles atendem 24 horas."
    # One line per reservation the turn stored, for a turn answered without
    # the model (NFR-02, NFR-03).
    reservation: "Reserva %{code}: %{quantity} × %{product}, retirada até %{pickup_until}."
    pickup_format: "%d/%m às %H:%M"
    # FR-20: under a reply the guardrail replaced, one line per product its
    # turn found, with what the catalogue said of it (FixedReply.products).
    product:
      line: "%{name}: %{details}."
      in_stock: "em estoque"
      out_of_stock: "sem estoque"
      prescription: "exige receita"
  commands:
    # FR-04: the notice comes before it.
    reset: "Pronto, começamos de novo. Em que posso ajudar?"
    # FR-05.
    delete: "Seus dados foram apagados: as mensagens, as reservas abertas e o histórico das conversas. Se escrever de novo, começamos do zero."
    # FR-12.
    trace: "Veja, passo a passo, como eu funciono nesta conversa: %{url}"
    # FR-19, and FR-18 on the web: the greeting /start gets, in one paragraph,
    # since it answers an agreement as a conversation's first reply, which the
    # ask's notice came before (FixedReply.greeting); and what /help lists.
    start: "Olá! Sou o atendente virtual da %{store}, uma farmácia fictícia: consulto preços e estoque, reservo produtos para você retirar na loja e conto os horários, as entregas e as formas de pagamento. Dúvidas sobre sintomas, doses e tratamentos ficam com o farmacêutico da loja. Os comandos estão em /help."
    help: "Sou o atendente virtual da %{store}, uma farmácia fictícia: consulto preços e estoque, reservo produtos para retirar na loja e conto os horários, as entregas e as formas de pagamento. Dúvidas de saúde ficam com o farmacêutico da loja.\nComandos:\n/reiniciar começa a conversa de novo\n/apagar apaga os seus dados\n/trace mostra como eu funciono nesta conversa\nPrivacidade: %{privacy}"
  # NFR-03's fallback: a turn the model could not answer (an error, the time
  # limit, the tool limit or a reply cut short; SR-20).
  fallback:
    model_error: "Desculpe, não consegui responder agora. Pode tentar de novo daqui a pouco?"
  # FR-14's fixed replies to a request past a per-IP or per-visitor limit,
  # sent with no model call and nothing stored (threat model SR-01).
  limits:
    now: "Você chegou ao limite da demo por agora. Tente de novo daqui a pouco."
    today: "Você chegou ao limite da demo por hoje. Volte amanhã."
  # FR-14: the reply of a month that reached its budget cap, and the reply of
  # a pause the operator forced, which names no limit and no date (the owner,
  # 2026-11-15), sent with no model call (threat model SR-02).
  budget:
    paused: "A demo está pausada até o próximo mês: chegou ao limite de gasto deste mês."
    forced: "A demo está pausada no momento. Volte mais tarde."
  # FR-19's fixed texts on Telegram, sent with no model call: the ask for the
  # agreement, after FR-01's notice, naming the button's phrase of
  # config/commands.yml; the line for a message that is not text, which no
  # file is fetched for; and the line for a text over 1,000 characters.
  telegram:
    ask: "Para responder, o modelo de IA da Anthropic lê cada mensagem que você manda. A política de privacidade conta o resto: %{privacy}\nSe estiver de acordo, toque em “%{agree}”."
    not_text: "Por aqui eu leio só texto: escreva a sua pergunta numa mensagem."
    too_long: "Sua mensagem passou de 1.000 caracteres, o limite da demo. Pode escrever uma mais curta?"
    # FR-05 on Telegram: after the deletion's confirmation, what the command
    # does not reach, the copy of the chat in the visitor's own app, as
    # /privacy says it (FixedReply.telegram_deleted).
    own_copy: "As mensagens que continuam neste chat são a sua cópia, no seu Telegram: a opção de limpar o histórico, no próprio Telegram, as apaga."
    # FR-19's buttons (M4, ADR-0017; Telegram::Buttons): the label of the
    # one that copies a reservation's code (FR-07) and of the one that opens
    # the conversation's trace page (FR-12); the openers' buttons are their
    # own texts (config/openers.yml).
    buttons:
      copy_code: "Copiar o código %{code}"
      trace: "Abrir o trace"
    # FR-19, written by bin/rails telegram:setup (Telegram::Setup): the command
    # menu of private chats, each command named by its first phrase with a
    # slash in config/commands.yml, the deletion last (Telegram allows 1 to
    # 256 characters a description); and the profile: the name (up to 64)
    # says it is a demo, the description the empty chat shows before Start
    # (up to 512) says what FR-01's notice says and names the model provider
    # and the privacy page, and the short description of the profile page
    # and of a shared link (up to 120).
    menu:
      reset: "começa a conversa de novo"
      trace: "mostra como eu funciono nesta conversa"
      help: "o que eu faço e os comandos"
      delete: "apaga os seus dados"
    profile:
      name: "Balcão (demo)"
      description: "Demonstração de portfólio: o atendente de IA da %{store}, uma farmácia fictícia. Consulta preços e estoque e reserva produtos; dúvidas de saúde ficam com o farmacêutico da loja. Para responder, o modelo de IA da Anthropic lê cada mensagem, que fica guardada por 7 dias; /apagar apaga tudo. Antes de ler a primeira, o atendente pede o seu “%{agree}”. Privacidade: %{privacy}"
      short_description: "Demo de portfólio: o atendente de IA de uma farmácia fictícia. As mensagens ficam guardadas por 7 dias."
