# Server-side strings (fixed replies, notices). Same keys in en.yml and
# es.yml; spec/i18n/locale_parity_spec.rb holds the three in step (NFR-09).
pt-BR:
  app:
    name: "Balcão"
  turn:
    # Before the first reply of a conversation (FR-01), one sentence (the
    # owner's decision of 2026-11-14). It names the delete command of its
    # language (config/commands.yml).
    notice: "Aviso: demonstração de portfólio com uma farmácia fictícia; as mensagens ficam guardadas por 7 dias e você pode apagá-las enviando /apagar."
    # FR-09's decline: the reply to a refusal (threat model SR-19) and, from
    # M2, to a reply the guardrail replaces (FR-20). The turn puts the offer
    # after it. The pharmacist is the store's, never "de plantão" (the
    # owner's decision of 2026-11-14).
    declined: "Isso eu não posso responder por aqui; quem responde é o farmacêutico da loja."
    # FR-10's MVP note: the offer of the pharmacist, with the phone and the
    # counter's hours of config/store.yml (FixedReply.offer). Days in a row
    # with the same hours go together: "days" for a run, "on_day" for a day.
    offer:
      line: "Para falar com o farmacêutico da loja, ligue %{phone} ou venha ao balcão (%{hours})."
      hours: "%{days}, das %{opens} às %{closes}"
      days: "de %{first} a %{last}"
      day: { monday: "segunda", tuesday: "terça", wednesday: "quarta", thursday: "quinta", friday: "sexta", saturday: "sábado", sunday: "domingo" }
      on_day: { monday: "às segundas", tuesday: "às terças", wednesday: "às quartas", thursday: "às quintas", friday: "às sextas", saturday: "aos sábados", sunday: "aos domingos" }
    # FR-09: a message that may be an emergency (the owner's decision of
    # 2026-11-14). Real public numbers on purpose, checked that day: SAMU's
    # 192 and Anvisa's free Disque-Intoxicação.
    emergency: "Se for uma urgência, ligue agora para o SAMU, no 192. Se alguém tomou remédio ou outro produto por engano ou em excesso, ligue também para o Disque-Intoxicação, no 0800 722 6001."
    # One line per reservation the turn stored, for a turn answered without
    # the model (NFR-02, NFR-03).
    reservation: "Reserva %{code}: %{quantity} × %{product}, retirada até %{pickup_until}."
    pickup_format: "%d/%m às %H:%M"
  commands:
    # FR-04: the notice comes before it.
    reset: "Pronto, começamos de novo. Em que posso ajudar?"
    # FR-05.
    delete: "Seus dados foram apagados: as mensagens, as reservas abertas e o histórico das conversas. Se escrever de novo, começamos do zero."
    # FR-12.
    trace: "Veja, passo a passo, como eu funciono nesta conversa: %{url}"
  # NFR-03's fallback: a turn the model could not answer (an error, the time
  # limit, the tool limit or a reply cut short; SR-20).
  fallback:
    model_error: "Desculpe, não consegui responder agora. Pode tentar de novo daqui a pouco?"
  # FR-14's fixed replies to a request past a per-IP or per-visitor limit,
  # sent with no model call and nothing stored (threat model SR-01).
  limits:
    now: "Você chegou ao limite da demo por agora. Tente de novo daqui a pouco."
    today: "Você chegou ao limite da demo por hoje. Volte amanhã."
  # FR-14: the reply of a month that reached its budget cap, or that the
  # operator paused, sent with no model call (threat model SR-02).
  budget:
    paused: "A demo está pausada até o próximo mês: chegou ao limite de gasto deste mês."
