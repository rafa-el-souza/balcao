# Server-side strings (fixed replies, notices). Same keys in pt-BR.yml and
# en.yml; spec/i18n/locale_parity_spec.rb holds the three in step (NFR-09).
es:
  app:
    name: "Balcão"
  turn:
    notice: "Aviso: demostración de portafolio con una farmacia ficticia; los mensajes se guardan 7 días y puedes borrarlos enviando /borrar."
    declined: "Eso no lo puedo responder por aquí; lo responde el farmacéutico de la tienda."
    offer:
      line: "Para hablar con el farmacéutico de la tienda, llama al %{phone} o ven al mostrador (%{hours})."
      hours: "%{days}, de %{opens} a %{closes}"
      days: "de %{first} a %{last}"
      day: { monday: "lunes", tuesday: "martes", wednesday: "miércoles", thursday: "jueves", friday: "viernes", saturday: "sábado", sunday: "domingo" }
      on_day: { monday: "los lunes", tuesday: "los martes", wednesday: "los miércoles", thursday: "los jueves", friday: "los viernes", saturday: "los sábados", sunday: "los domingos" }
    emergency: "Si es una urgencia, llama ahora al SAMU, el servicio de ambulancias, al 192. Si alguien tomó un medicamento u otro producto por error o de más, llama también al Disque-Intoxicação, la línea de intoxicaciones, al 0800 722 6001."
    reservation: "Reserva %{code}: %{quantity} × %{product}, retiro hasta el %{pickup_until}."
    pickup_format: "%d/%m a las %H:%M"
  commands:
    reset: "Listo, empezamos de nuevo. ¿En qué puedo ayudarte?"
    delete: "Tus datos fueron borrados: los mensajes, las reservas abiertas y el historial de las conversaciones. Si escribes de nuevo, empezamos desde cero."
    trace: "Mira, paso a paso, cómo funciono en esta conversación: %{url}"
  fallback:
    model_error: "Lo siento, no pude responder ahora. ¿Puedes intentarlo de nuevo en un momento?"
  limits:
    now: "Llegaste al límite de la demo por ahora. Intenta de nuevo en un rato."
    today: "Llegaste al límite de la demo por hoy. Vuelve mañana."
  budget:
    paused: "La demo está en pausa hasta el próximo mes: llegó al límite de gasto de este mes."
