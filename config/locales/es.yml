# Server-side strings (fixed replies, notices). Same keys in pt-BR.yml and
# en.yml; spec/i18n/locale_parity_spec.rb holds the three in step (NFR-09).
es:
  app:
    name: "Balcão"
  turn:
    notice: "Aviso: demostración de portafolio con una farmacia ficticia; los mensajes se guardan 7 días y puedes borrarlos enviando /borrar."
    declined: "Eso no lo puedo responder por aquí; lo responde el farmacéutico de la tienda."
    # FR-20 and FR-09: the opening of a reply the guardrail replaced where the
    # model had asked for the emergency line, which follows it, in place of the
    # decline: the call to call now, naming no pharmacist (the owner,
    # 2026-11-20, pull request #59's M1).
    call_now: "Llama ahora para pedir ayuda."
    offer:
      line: "Para hablar con el farmacéutico de la tienda, llama al %{phone} o ven al mostrador (%{hours})."
      hours: "%{days}, de %{opens} a %{closes}"
      days: "de %{first} a %{last}"
      day: { monday: "lunes", tuesday: "martes", wednesday: "miércoles", thursday: "jueves", friday: "viernes", saturday: "sábado", sunday: "domingo" }
      on_day: { monday: "los lunes", tuesday: "los martes", wednesday: "los miércoles", thursday: "los jueves", friday: "los viernes", saturday: "los sábados", sunday: "los domingos" }
    emergency: "Si es una urgencia, llama ahora al SAMU, el servicio de ambulancias, al 192. Si alguien tomó un medicamento u otro producto por error o de más, llama también al Disque-Intoxicação, la línea de intoxicaciones, al 0800 722 6001. Si estás pensando en hacerte daño o en quitarte la vida, llama al CVV, la línea de apoyo emocional, al 188: la llamada es gratuita y atienden las 24 horas."
    reservation: "Reserva %{code}: %{quantity} × %{product}, retiro hasta el %{pickup_until}."
    pickup_format: "%d/%m a las %H:%M"
    product:
      line: "%{name}: %{details}."
      in_stock: "en stock"
      out_of_stock: "sin stock"
      prescription: "requiere receta"
  commands:
    reset: "Listo, empezamos de nuevo. ¿En qué puedo ayudarte?"
    delete: "Tus datos fueron borrados: los mensajes, las reservas abiertas y el historial de las conversaciones. Si escribes de nuevo, empezamos desde cero."
    trace: "Mira, paso a paso, cómo funciono en esta conversación: %{url}"
    # FR-19, and FR-18 on the web: the greeting /start gets, in one paragraph,
    # since it answers an agreement as a conversation's first reply, which the
    # ask's notice came before (FixedReply.greeting); and what /help lists.
    start: "¡Hola! Soy el asistente virtual de %{store}, una farmacia ficticia: consulto precios y existencias, reservo productos para que los recojas en la tienda y te cuento los horarios, las entregas y las formas de pago. Las dudas sobre síntomas, dosis y tratamientos son para el farmacéutico de la tienda. Los comandos están en /help."
    help: "Soy el asistente virtual de %{store}, una farmacia ficticia: consulto precios y existencias, reservo productos para recoger en la tienda y te cuento los horarios, las entregas y las formas de pago. Las dudas de salud son para el farmacéutico de la tienda.\nComandos:\n/reiniciar empieza la conversación de nuevo\n/borrar borra tus datos\n/trace muestra cómo funciono en esta conversación\nPrivacidad: %{privacy}"
  fallback:
    model_error: "Lo siento, no pude responder ahora. ¿Puedes intentarlo de nuevo en un momento?"
  limits:
    now: "Llegaste al límite de la demo por ahora. Intenta de nuevo en un rato."
    today: "Llegaste al límite de la demo por hoy. Vuelve mañana."
  budget:
    paused: "La demo está en pausa hasta el próximo mes: llegó al límite de gasto de este mes."
    forced: "La demo está en pausa por ahora. Vuelve más tarde."
    daily: "La demo está en pausa hasta la medianoche (hora de Brasilia): llegó al límite de gasto de hoy."
  # Threat model SR-35: the operator's alerts through the bot, in the
  # language of the operator's app at the link, and the bot's answer to the
  # link (OperatorChat, OperatorAlert); FR-14's at the cap and of a pause the
  # closed gate makes name the month or the day, the limit and the spend,
  # never a visitor's words.
  operator:
    linked: "Este chat está vinculado a Balcão: las alertas del operador llegarán aquí."
    test: "Balcão: prueba de la alerta del operador. Si este mensaje llegó, las alertas llegan a este chat."
    cap:
      paused: "Balcão: el gasto de %{month} llegó al tope de US$ %{cap} (US$ %{spent} gastados), y la demo está en pausa hasta el próximo mes. Para reanudarla antes, sube el tope con un deploy (el runbook dice cómo)."
      serving: "Balcão: el gasto de %{month} llegó al tope de US$ %{cap} (US$ %{spent} gastados), pero el modo forzado %{mode} sigue sirviendo, y gastando, hasta que se libere."
    gate:
      month: "Balcão: el gasto de %{month} pasó del 70 % del tope (US$ %{spent} de US$ %{cap}), y el modelo económico aún no puede servir, porque la compuerta de las evals está cerrada: la demo está en pausa hasta el próximo mes. El runbook dice cómo reanudarla antes."
      day: "Balcão: el gasto de %{day} llegó a la porción del día (US$ %{day_spent} de US$ %{slice}), y el modelo económico aún no puede servir, porque la compuerta de las evals está cerrada: la demo está en pausa hasta la medianoche (hora de Brasilia)."
    modes:
      normal: "normal"
      economy: "economía"
    decimal_mark: ","
  # FR-19's fixed texts on Telegram, sent with no model call: the ask for the
  # agreement, after FR-01's notice, naming the button's phrase of
  # config/commands.yml; the line for a message that is not text, which no
  # file is fetched for; and the line for a text over 1,000 characters.
  telegram:
    ask: "Para responder, el modelo de IA de Anthropic lee cada mensaje que mandas. La política de privacidad cuenta el resto: %{privacy}\nSi estás de acuerdo, toca “%{agree}”."
    not_text: "Por aquí solo leo texto: escribe tu pregunta en un mensaje."
    too_long: "Tu mensaje pasa de 1.000 caracteres, el límite de la demo. ¿Puedes escribir uno más corto?"
    own_copy: "Los mensajes que siguen en este chat son tu copia, en tu Telegram: la opción de borrar el historial, en el propio Telegram, los borra."
    buttons:
      copy_code: "Copiar el código %{code}"
      trace: "Abrir el trace"
    menu:
      reset: "empieza la conversación de nuevo"
      trace: "muestra cómo funciono en esta conversación"
      help: "lo que hago y los comandos"
      delete: "borra tus datos"
    profile:
      name: "Balcão (demo)"
      description: "Demo de portafolio: el asistente de IA de %{store}, una farmacia ficticia. Consulta precios y existencias y reserva productos; las dudas de salud son para el farmacéutico de la tienda. Para responder, el modelo de IA de Anthropic lee cada mensaje, que se guarda 7 días; /borrar lo borra todo. Antes de leer el primero, el asistente pide tu “%{agree}”. Privacidad: %{privacy}"
      short_description: "Demo de portafolio: el asistente de IA de una farmacia ficticia. Los mensajes se guardan 7 días."
