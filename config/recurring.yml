#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # FR-15: the nightly reset and the seven-day purge (app/jobs/nightly_reset_job.rb),
  # at 03:00 São Paulo whatever the host's zone.
  nightly_reset:
    class: NightlyResetJob
    schedule: "0 3 * * * America/Sao_Paulo"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # The cable's copies past their 5 minutes (config/cable.yml; threat model
  # SR-32, ADR-0015), whatever the writes, all of them each run: Solid Cable's
  # own TrimJob deletes 100 (review finding C1 of pull request #23).
  trim_solid_cable_messages:
    command: "SolidCable::Message.trimmable.in_batches.delete_all"
    schedule: every 5 minutes
