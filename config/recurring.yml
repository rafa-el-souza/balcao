# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # FR-15: the nightly reset and the seven-day purge (app/jobs/nightly_reset_job.rb),
  # at 03:00 São Paulo whatever the host's zone.
  nightly_reset:
    class: NightlyResetJob
    schedule: "0 3 * * * America/Sao_Paulo"
  # NFR-03's sweep (app/jobs/stranded_sweep_job.rb): an update left unread, a
  # turn left without a reply and a Telegram reply left pending, stopped for
  # more than five minutes, taken up again.
  stranded_sweep:
    class: StrandedSweepJob
    schedule: every minute
  # FR-17: the canary, a visitor's question through a visitor's turn on the
  # economy model, told to the external monitor's heartbeat
  # (app/models/canary.rb); a run never tried again, the next is ten minutes
  # away.
  canary:
    class: CanaryJob
    schedule: every 10 minutes
  # Beside it, five minutes apart, the Telegram delivery watch over
  # getWebhookInfo, told to a heartbeat of its own
  # (app/transports/telegram/watch.rb; the owner, 2026-11-21).
  telegram_watch:
    class: TelegramWatchJob
    schedule: "5-59/10 * * * *"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # The cable's copies past their 5 minutes (config/cable.yml; threat model
  # SR-32, ADR-0015), whatever the writes, all of them each run: Solid Cable's
  # own TrimJob deletes 100 (review finding C1 of pull request #23).
  trim_solid_cable_messages:
    command: "SolidCable::Message.trimmable.in_batches.delete_all"
    schedule: every 5 minutes
