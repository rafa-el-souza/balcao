# The visitor's commands, matched before the model is called (design §6.3):
# reset starts the conversation over (FR-04), delete erases the visitor's data
# (FR-05), trace answers with the link to the conversation's trace (FR-12),
# start greets and help lists what the attendant does and the commands, the
# two Telegram requires of every bot and the web chat matches too (FR-18,
# FR-19). A command may carry the bot's username ("/help@BalcaoDemoBot"), and
# /start the parameter of a deep link, which is ignored until FR-23 reads it.
#
# A message is a command when it is exactly one of these phrases, ignoring
# case, accents, spaces around and between words, an opening ¿ or ¡ and the
# final punctuation; never when a phrase is only part of it, so "não quero
# apagar meus dados" is a message for the attendant, not a deletion. A command
# is matched in any language, whatever the conversation's; a phrase belongs to
# one command only. A reply follows the language of a phrase only one
# language lists; a phrase several list, such as "reset", which FR-04 names
# among a Portuguese visitor's phrases, follows the conversation's.
# CommandPhrases reads this file once per process.
reset:
  pt: [/reiniciar, reiniciar, recomeçar, começar de novo, /reset, reset]
  en: [/reset, reset, restart, start over]
  es: [/reiniciar, reiniciar, empezar de nuevo, /reset, reset]
delete:
  pt: [/apagar, apagar meus dados]
  en: [/delete, delete my data]
  es: [/borrar, borrar mis datos]
trace:
  pt: [/trace, como você funciona?]
  en: [/trace, how do you work?]
  es: [/trace, ¿cómo funcionas?]
start:
  pt: [/start]
  en: [/start]
  es: [/start]
help:
  pt: [/help]
  en: [/help]
  es: [/help]
# Not a command: the phrases that count as the agreement the bot asks for
# before it reads anything of a person on Telegram, while it holds no row of
# that person; afterwards they are a message like any other (FR-19, the
# owner's decision of 2026-11-14). The first of each language is the ask's
# button, as the privacy page names it.
agree:
  pt: [Concordo, eu concordo]
  en: [I agree]
  es: [Acepto]
