# Kamal destination ensaio: the rehearsal (ADR-0011), deep-merged by Kamal
# over config/deploy.yml and deployed only with `bin/deploy -d ensaio` from
# the development account, with the secrets of .kamal/secrets.ensaio.
#
# Since the production cut (M3-7) this destination is ensaio.rafasouza.dev.br,
# throwaway rehearsal hosts on the reserved IP, made and deleted per slice
# (docs/runbook.md, the rehearsal flow); production has the public name. Until
# the cut it was the MVP host, which served the demo itself (ADR-0011's MVP
# amendment). A rehearsal host runs in its own mode (design §8, M3-6b), which
# the boot holds to the name (config/required_environment.rb).
#
# The host's address, the deploy key and the ssh config (which pins host keys
# in its own known_hosts) are read from the deploying shell, so no address or
# path lands in the repository; a missing one stops Kamal before it connects.
#
# The model: the fake one, the replies the evals recorded, when
# ENSAIO_MODEL_ADAPTER is unset or blank (as .env.example lists it), unless
# the rehearsal env file holds ENSAIO_MODEL_ADAPTER=real, for the host's whole
# life, which runs the real model on the dev/eval key. Any other value stops
# Kamal here. Every command renders this file again from its own shell, and
# `kamal app exec` puts that render's settings beside the secrets the host
# kept from its last boot, so a shell naming another model than the host's
# last deploy is refused at boot (docs/runbook.md, the rehearsal flow).
<% model = ENV["ENSAIO_MODEL_ADAPTER"].to_s.empty? ? "fake" : ENV["ENSAIO_MODEL_ADAPTER"] -%>
<% raise "ENSAIO_MODEL_ADAPTER must be fake or real, not #{model.inspect}" unless %w[fake real].include?(model) -%>

servers:
  web:
    hosts:
      - <%= ENV.fetch("ENSAIO_HOST") %>
  job:
    hosts:
      - <%= ENV.fetch("ENSAIO_HOST") %>

proxy:
  host: ensaio.rafasouza.dev.br

registry:
  server: localhost:5555

ssh:
  keys_only: true
  keys:
    - <%= ENV.fetch("ENSAIO_SSH_KEY") %>
  config:
    - <%= ENV.fetch("ENSAIO_SSH_CONFIG") %>

# Every answer says noindex: a rehearsal host's name is in the certificate
# logs within minutes (design §8). The cap is one host's: its ledger lives in
# the host's own database and starts at zero on every rehearsal host, so a
# real-model host pauses with its fixed reply at US$ 10, half the dev/eval
# key's console limit of US$ 20 a month, which also pays the eval runs (FR-14;
# the owner's decision of 2026-11-14, for the MVP host). That console limit is
# what fences the key's month across hosts, read before a real-model
# rehearsal (docs/runbook.md, the rehearsal flow).
#
# This list replaces the base's (Kamal deep-merges a destination, a list
# whole), so Kamal injects only these, whatever the rehearsal env file holds:
# never the two heartbeat URLs, which the boot refuses off the public name (a
# rehearsal host has no monitor), and the model key only beside the real
# model, since the boot refuses it beside the fake one (threat model SR-25).
env:
  clear:
    APP_HOST: ensaio.rafasouza.dev.br
    MODEL_ADAPTER: <%= model %>
    NOINDEX: "true"
    BUDGET_CAP_USD: "10"
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_PASSWORD
    - APP_DATABASE_PASSWORD
<% if model == "real" -%>
    - ANTHROPIC_API_KEY
<% end -%>
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - IDENTITY_PEPPER
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_WEBHOOK_SECRET
    - TURNSTILE_SECRET_KEY
