# Kamal, base configuration: production (ADR-0006, ADR-0011, design §8).
#
# Deployed only by the owner, from the operator account, with the pinned
# global kamal invoked directly (threat model SR-37, SR-38): this file is part
# of the deploy-path review before every production deploy. The rehearsal
# destination, config/deploy.ensaio.yml, is deep-merged over it and replaces
# every production-specific value; bin/deploy deploys only that destination.
# Secrets are listed here by name; their values come from .kamal/secrets.

service: balcao
image: balcao

# One host. Its name is an SSH alias that the operator's own ssh config
# resolves (M3), so no address of the production host lands in the repository.
# Every container runs as the image's non-root user (uid 1000) on a read-only
# root filesystem; Rails writes only its tmp directory and /tmp, both in
# memory (threat model SR-24). Docker would mount /rails/tmp owned by root.
# Each container has its own memory and CPU limit (M3-6), so one that runs
# away, a leak or a loop, leaves the host's memory and its other CPU to the
# rest; the host has no swap. At its memory limit the kernel kills a process
# inside it: a Solid Queue worker, which its supervisor replaces (the turn it
# ran fails, and the sweep takes it up again within minutes), a Postgres
# backend, after which the database resets every connection, or the web
# server, whose container Docker restarts when its main process exits
# (#67's review, C8). Measured on the MVP host on 2026-11-21, each container's peak since
# its start: job 443 MiB, web 179, Postgres 114, kamal-proxy 13. Two to
# nineteen times that each, and the four limits together, 3.25 GiB, fit the
# 3.73 GiB of a CX23; a new limit reaches a running accessory or proxy only
# at its deliberate reboot (docs/runbook.md).
servers:
  web:
    hosts:
      - balcao-prod
    options: &container
      read-only: true
      tmpfs:
        - /rails/tmp:uid=1000,gid=1000,mode=0700
        - /tmp
      memory: 1g
      cpus: 1.5
  # Solid Queue in its own container, never inside Puma (design §6.2).
  job:
    hosts:
      - balcao-prod
    cmd: bin/jobs
    options: *container

# kamal-proxy terminates TLS with a Let's Encrypt certificate and polls /up
# while a new container boots.
proxy:
  ssl: true
  host: balcao.rafasouza.dev.br
  app_port: 80
  healthcheck:
    path: /up
  # A body over 1 MB is refused at the proxy, before the app's server buffers
  # it; the API's own limit is 16 KB (threat model SR-04). With ssl, the proxy
  # drops a client's X-Forwarded-For and sends the client's address, which
  # the app trusts from a private address only (SR-36).
  buffering:
    max_request_body: 1000000
  # The proxy's own release, pinned (threat model SR-27). Kamal 2.12 alone
  # boots v0.9.2, which keeps a client's connection open for as long as the
  # client stalls (GHSA-g8jf-9mcc-x4f2, high; fixed in v0.10.2, which also
  # limits TLS 1.2 to AEAD suites). A deploy never swaps a running proxy:
  # `kamal proxy reboot` does, as docs/runbook.md says. A plain tag: Kamal reads
  # the running version back from it, and a digest there stops every deploy.
  # A tag can be pushed again, so the digest it resolved to when pinned is
  # written beside it, and a host gets the image by that digest, under the
  # tag, before Kamal boots the proxy (the runbook's swap).
  run:
    version: v0.10.2 # basecamp/kamal-proxy@sha256:a686220c2aa42c4f9bbcfe851b1d21b2cedee0b5c389890c29d205282379da7c
    options:
      memory: 256m
      cpus: 1

# Kamal's local registry: the image is built in the deploying account and
# reaches the host through an SSH port forward, so no registry account exists.
# Each account has its own loopback port (5556 here, 5555 for the rehearsal).
registry:
  server: localhost:5556

# The Docker engine's own builder, which fetches no BuildKit image (Kamal's
# default docker-container builder runs moby/buildkit by a mutable tag) and
# resolves DNS in RUN steps under rootless Docker, where the docker-container
# builder did not (review finding FV1, pull request #4). The engine's
# containerd image store exports straight to the local registry.
builder:
  arch: amd64
  driver: docker

# The non-root deploy user of ops/cloud-init.yml, whose docker group makes the
# deploy key a root credential on that host. The workstation's SSH agent is
# never forwarded to it (SR-37).
ssh:
  user: deploy
  forward_agent: false

# APP_HOST drives the allowed hosts, the Origin allow-list, the cable origins
# and absolute links (design §8, threat model SR-03). MODEL_ADAPTER is the
# real model, with its key, on the public name; a rehearsal host's
# destination runs the fake one by default, with no key and NOINDEX=true,
# which the boot holds to the name (design §8;
# spec/deploy/kamal_config_spec.rb reads each destination). BUDGET_CAP_USD
# is the month's model spend at which the demo pauses
# (FR-14, ADR-0003). A blank required name stops the app at boot
# (config/required_environment.rb, SR-25); the two monitor URLs, the canary's
# and the Telegram watch's heartbeats (FR-17), are required on the public
# name and blank on a rehearsal host (design §8). The app connects as its own
# database role with APP_DATABASE_PASSWORD; POSTGRES_PASSWORD, the owner's,
# serves the web container's entrypoint alone, which takes it out of the
# environment of the command it starts (bin/docker-entrypoint, M3-4).
env:
  clear:
    APP_HOST: balcao.rafasouza.dev.br
    DB_HOST: balcao-db
    MODEL_ADAPTER: real
    BUDGET_CAP_USD: "100"
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_PASSWORD
    - APP_DATABASE_PASSWORD
    - ANTHROPIC_API_KEY
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - IDENTITY_PEPPER
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_WEBHOOK_SECRET
    - TURNSTILE_SECRET_KEY
    - MONITOR_URL
    - TELEGRAM_MONITOR_URL

logging:
  options:
    max-size: 10m
    max-file: "5"

accessories:
  # Postgres on the Kamal Docker network only: no port is published, so the
  # cloud firewall's 22, 80 and 443 stay the only way in (SR-24). Attached by
  # role, never by a literal host, so the rehearsal inherits nothing of
  # production's host. The image pins the major CI tests against (18); from
  # version 18 the image keeps its data under /var/lib/postgresql/18/docker,
  # so the volume is /var/lib/postgresql. Accessories are not updated by
  # kamal deploy: a new image is a deliberate `kamal accessory reboot db`.
  # Postgres's own log, which this app does not mask, keeps neither a failing
  # statement's text nor its DETAIL line, which may quote a visitor's words,
  # an address in a cache key or an identity's hash (threat model SR-30;
  # review finding C1 of pull request #40). A changed command applies at the
  # accessory's next boot, the same deliberate reboot.
  db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    cmd: postgres -c log_min_error_statement=panic -c log_error_verbosity=terse
    role: web
    options:
      memory: 1g
      cpus: 1.5
    env:
      clear:
        POSTGRES_USER: balcao
        POSTGRES_DB: balcao_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql
