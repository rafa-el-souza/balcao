# The day-1 CI set of design §9.1 (NFR-08): lint, static security analysis,
# dependency audit, the suites, locale-key parity and the secret scan. CI holds
# no secret and never deploys (threat model SR-29).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruby_static:
    name: "Ruby: RuboCop, Brakeman, bundler-audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop -f github

      - name: Brakeman, no medium or high warning (threat model SR-28)
        run: bin/brakeman --no-pager --quiet -w2 --exit-on-warn --exit-on-error

      - name: bundler-audit (threat model SR-27)
        run: bin/bundler-audit

  ruby_test:
    name: "Ruby: RSpec"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/balcao_test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Locale key parity, server (design NFR-09)
        run: bundle exec rspec spec/i18n

      - name: RSpec
        run: bundle exec rspec

  web:
    name: "Web: ESLint, Prettier, types, Vitest, build, npm audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: npm audit, runtime tree at high (threat model SR-27)
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Locale key parity, web (design NFR-09)
        run: npm test -- src/locales

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  secret_scan:
    name: "Secrets: gitleaks"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks, checksum pinned
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit (threat model SR-25)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
