# The catalogue of Farmácia Vida Longa (design §1.2, FR-06), loaded by
# `bin/rails db:seed` and, every night, brought back to these stocks and
# prices (FR-15). CatalogueSeed reads it and refuses a malformed entry
# (spec/models/catalogue_seed_spec.rb); spec/evals/seed_spec.rb checks that
# every product an eval case asks about is here.
#
# Invented, and generic on purpose (threat model SR-33): each medicine is
# named by its active ingredient, strength and pack, never by a brand, so no
# real company's product appears; a visitor who asks for a brand is searched
# by its active ingredient (design §6.4). Prices are made up in the range a
# Brazilian pharmacy charges; they are not a price list.
#
# Fields, all required:
#   sku                   the seed key, a lowercase slug, never reused: the
#                         nightly reset finds the product by it, and an open
#                         reservation keeps pointing at the same row
#   name                  as the visitor reads it; unique
#   active_ingredient     what a search by ingredient matches; null for a
#                         product that has none
#   price                 in reais, a string with two decimals ("7.90"), so
#                         no float rounding reaches the price column
#   stock                 units on the shelf after the nightly reset
#   prescription_required sold only against a prescription at the counter,
#                         never reserved (FR-06, FR-07)
products:
  # Over the counter.
  - sku: dipirona-500mg-10cp
    name: Dipirona 500 mg, 10 comprimidos
    active_ingredient: dipirona
    price: "7.90"
    stock: 40
    prescription_required: false
